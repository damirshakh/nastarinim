<!doctype html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#0b141a">
  <title>Messenger</title>
  <style>
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;height:100%;font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    body{background:#0b141a;color:#e9edef;overflow:hidden}
    button,input{font:inherit}
    button{border:0;cursor:pointer}
    .app{height:100dvh;display:flex;background:#111b21}
    .sidebar{width:340px;min-width:300px;border-right:1px solid #26343c;background:#111b21;display:flex;flex-direction:column}
    .side-head{height:68px;padding:12px 16px;display:flex;align-items:center;justify-content:space-between;background:#202c33}
    .brand{font-size:20px;font-weight:700}
    .icon-btn{width:42px;height:42px;border-radius:50%;background:transparent;color:#aebac1;font-size:21px}
    .icon-btn:hover{background:#2a3942}
    .search{padding:10px 12px;background:#111b21}
    .search-box{height:42px;border-radius:9px;background:#202c33;display:flex;align-items:center;padding:0 13px;color:#8696a0}
    .search-box input{width:100%;border:0;outline:0;background:transparent;color:#e9edef;margin-left:9px}
    .conversation{padding:14px 16px;display:flex;align-items:center;gap:12px;background:#202c33;border-bottom:1px solid #26343c}
    .avatar{width:48px;height:48px;border-radius:50%;display:grid;place-items:center;background:#128c7e;font-weight:700;font-size:18px;flex:none}
    .conv-info{min-width:0;flex:1}
    .conv-top{display:flex;justify-content:space-between;gap:8px}
    .conv-name{font-weight:600}
    .time{font-size:12px;color:#8696a0}
    .last{font-size:13px;color:#8696a0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
    .chat{flex:1;min-width:0;display:flex;flex-direction:column;background:#0b141a}
    .chat-head{height:68px;padding:10px 18px;display:flex;align-items:center;gap:12px;background:#202c33;border-bottom:1px solid #26343c}
    .head-info{flex:1}
    .head-name{font-weight:650}
    .status{font-size:12px;color:#8696a0;margin-top:3px}
    .messages{flex:1;overflow-y:auto;padding:24px clamp(14px,5vw,80px);display:flex;flex-direction:column;gap:7px;background:
      radial-gradient(circle at 20% 20%,rgba(20,50,60,.12),transparent 25%),
      radial-gradient(circle at 80% 70%,rgba(20,50,60,.12),transparent 25%),#0b141a}
    .empty{text-align:center;color:#8696a0;margin:auto;background:#202c33;padding:10px 16px;border-radius:9px;font-size:13px}
    .bubble{max-width:min(72%,560px);padding:8px 10px 6px;border-radius:9px;background:#202c33;align-self:flex-start;box-shadow:0 1px 1px rgba(0,0,0,.15)}
    .bubble.mine{align-self:flex-end;background:#005c4b}
    .bubble-text{white-space:pre-wrap;word-break:break-word;font-size:14.5px;line-height:1.42}
    .bubble img,.bubble video{display:block;max-width:100%;max-height:340px;border-radius:7px;margin-bottom:5px}
    .bubble audio{width:250px;max-width:100%}
    .bubble-meta{text-align:right;color:#b7c5cb;font-size:10px;margin-top:3px}
    .composer-wrap{padding:10px 14px;background:#202c33}
    .preview{display:none;padding:8px 10px;margin-bottom:8px;background:#111b21;border-radius:9px;align-items:center;gap:10px}
    .preview.show{display:flex}
    .preview-name{flex:1;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .composer{display:flex;align-items:flex-end;gap:8px}
    .attach{display:flex;gap:2px}
    .message-input{flex:1;min-height:44px;max-height:130px;resize:none;border:0;outline:0;border-radius:10px;background:#2a3942;color:#e9edef;padding:12px 14px}
    .message-input::placeholder{color:#8696a0}
    .send{width:46px;height:46px;border-radius:50%;background:#00a884;color:white;font-size:20px}
    .send:disabled{opacity:.45;cursor:not-allowed}
    .file-input{display:none}
    .mobile-back{display:none}
    @media(max-width:760px){
      .sidebar{width:100%;min-width:0}
      .chat{display:none}
      .app.chat-open .sidebar{display:none}
      .app.chat-open .chat{display:flex}
      .mobile-back{display:block}
      .messages{padding:16px 10px}
      .bubble{max-width:86%}
    }
  </style>
</head>
<body>
<div class="app" id="app">
  <aside class="sidebar">
    <div class="side-head">
      <div class="brand">Nastarinim</div>
  
    </div> 
    <div class="conversation" id="conversation">
      <div class="avatar">🪐</div>
      <div class="conv-info">
        <div class="conv-top"><span class="conv-name">Hayotim</span><span class="time" id="listTime"></span></div>
        <div class="last" id="lastMessage">Muloqotni boshlang</div>
      </div>
    </div>
  </aside>

  <main class="chat">
    <header class="chat-head">
      <button class="icon-btn mobile-back" id="back">‹</button>
      <div class="avatar">🪐</div>
      <div class="head-info">
        <div class="head-name">Hayotim</div>
        <div class="status" id="status">kutib turimman</div>
      </div>
    </header>

    <section class="messages" id="messages">
      <div class="empty" id="empty">Video yoki Golos tashla jonim </div>
    </section>

    <div class="composer-wrap">
      <div class="preview" id="preview">
        <span id="previewIcon">📎</span>
        <div class="preview-name" id="previewName"></div>
        <audio id="previewAudio" controls style="display:none;max-width:260px;width:100%;"></audio>
        <button class="icon-btn" id="clearFile" title="Bekor qilish">✕</button>
      </div>
      <div class="composer">
        <div class="attach">
          <button class="icon-btn" id="fileBtn" title="Rasm yoki fayl">📎</button>
          <button class="icon-btn" id="cameraBtn" title="Kamera">📷</button>
          <button class="icon-btn" id="videoBtn" title="Video">🎥</button>
        </div>
        <textarea class="message-input" id="message" rows="1" placeholder="Xabar yozing..."></textarea>
        <button class="send" id="micBtn" title="Ovoz yozish">🎤</button>
        <button class="send" id="sendBtn" title="Yuborish">➤</button>
      </div>
      <input class="file-input" id="fileInput" type="file" accept="image/*,video/*,audio/*,.pdf,.doc,.docx,.zip">
      <input class="file-input" id="cameraInput" type="file" accept="image/*" capture="environment">
      <input class="file-input" id="videoInput" type="file" accept="video/*" capture="environment">
    </div>
  </main>
</div>

<script>
const CONFIG = {
  workerUrl: "https://nastarinim.damirshokh.workers.dev"
};

const app = document.getElementById("app");
const messages = document.getElementById("messages");
const message = document.getElementById("message");
const sendBtn = document.getElementById("sendBtn");
const micBtn = document.getElementById("micBtn");
const fileInput = document.getElementById("fileInput");
const cameraInput = document.getElementById("cameraInput");
const videoInput = document.getElementById("videoInput");
const preview = document.getElementById("preview");
const previewName = document.getElementById("previewName");
const previewAudio = document.getElementById("previewAudio");
const previewIcon = document.getElementById("previewIcon");
const empty = document.getElementById("empty");
const lastMessage = document.getElementById("lastMessage");
const listTime = document.getElementById("listTime");
const status = document.getElementById("status");

let selectedFile = null;
let recorder = null;
let chunks = [];
let recording = false;

function timeNow(){
  return new Date().toLocaleTimeString("uz-UZ",{hour:"2-digit",minute:"2-digit"});
}
function escapeHtml(s){
  return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]));
}
function addBubble({text="",file=null,mine=true}){
  empty.style.display="none";
  const b=document.createElement("div");
  b.className="bubble"+(mine?" mine":"");
  if(file){
    const url=URL.createObjectURL(file);
    if(file.type.startsWith("image/")){
      const img=document.createElement("img"); img.src=url; img.alt=file.name; b.appendChild(img);
    }else if(file.type.startsWith("video/")){
      const v=document.createElement("video"); v.src=url; v.controls=true; b.appendChild(v);
    }else if(file.type.startsWith("audio/")){
      const a=document.createElement("audio"); a.src=url; a.controls=true; b.appendChild(a);
    }else{
      const d=document.createElement("div"); d.textContent="📎 "+file.name; b.appendChild(d);
    }
  }
  if(text){
    const t=document.createElement("div"); t.className="bubble-text"; t.textContent=text; b.appendChild(t);
  }
  const meta=document.createElement("div"); meta.className="bubble-meta"; meta.textContent=timeNow()+"  ✓"; b.appendChild(meta);
  messages.appendChild(b);
  messages.scrollTop=messages.scrollHeight;
  lastMessage.textContent=file ? ("📎 "+file.name) : text;
  listTime.textContent=timeNow();
}

function chooseFile(file){
  if(!file) return;

  selectedFile=file;
  previewName.textContent=file.name || "Ovozli xabar";
  preview.classList.add("show");

  if(file.type.startsWith("audio/")){
    previewIcon.textContent="🎤";
    previewAudio.src=URL.createObjectURL(file);
    previewAudio.style.display="block";
  }else{
    previewIcon.textContent="📎";
    previewAudio.removeAttribute("src");
    previewAudio.style.display="none";
  }
}

function clearFile(){
  if(previewAudio.src) URL.revokeObjectURL(previewAudio.src);

  selectedFile=null;
  preview.classList.remove("show");
  previewName.textContent="";
  previewIcon.textContent="📎";
  previewAudio.removeAttribute("src");
  previewAudio.style.display="none";

  fileInput.value="";
  cameraInput.value="";
  videoInput.value="";
}

async function send(){
  const text=message.value.trim();
  if(!text && !selectedFile) return;
  sendBtn.disabled=true;
  try{
    addBubble({text,file:selectedFile});
    const fd=new FormData();
    fd.append("type", selectedFile ? (selectedFile.type.startsWith("image/")?"image":selectedFile.type.startsWith("video/")?"video":selectedFile.type.startsWith("audio/")?"voice":"file") : "text");
    fd.append("name","Messenger foydalanuvchisi");
    if(text) fd.append("message",text);
    if(selectedFile) fd.append("file",selectedFile,selectedFile.name);
    const r=await fetch(CONFIG.workerUrl,{method:"POST",body:fd});
    if(!r.ok) throw new Error("Server: "+r.status);
    message.value="";
    clearFile();
    message.style.height="44px";
    status.textContent="kutib turimman";
  }catch(e){
    alert("Xabar yuborilmadi. Internet yoki Worker sozlamalarini tekshiring.");
    console.error(e);
  }finally{sendBtn.disabled=false}
}

message.addEventListener("input",()=>{
  message.style.height="44px";
  message.style.height=Math.min(message.scrollHeight,130)+"px";
});
message.addEventListener("keydown",e=>{
  if(e.key==="Enter"&&!e.shiftKey){e.preventDefault();send();}
});
document.getElementById("sendBtn").onclick=send;
document.getElementById("fileBtn").onclick=()=>fileInput.click();
document.getElementById("cameraBtn").onclick=()=>cameraInput.click();
document.getElementById("videoBtn").onclick=()=>videoInput.click();
document.getElementById("clearFile").onclick=clearFile;
[fileInput,cameraInput,videoInput].forEach(i=>i.onchange=()=>chooseFile(i.files[0]));
document.getElementById("conversation").onclick=()=>app.classList.add("chat-open");
document.getElementById("back").onclick=()=>app.classList.remove("chat-open");
const newChat=document.getElementById("newChat");
if(newChat){
  newChat.onclick=()=>{
    messages.innerHTML="";
    messages.appendChild(empty);
    empty.style.display="block";
    lastMessage.textContent="Muloqotni boshlang";
  };
}
const search=document.getElementById("search");
if(search){
  search.oninput=e=>{
    const q=e.target.value.toLowerCase();
    document.getElementById("conversation").style.display=("admin".includes(q)||!q)?"flex":"none";
  };
}

micBtn.onclick=async()=>{
  if(recording){
    if(recorder && recorder.state!=="inactive") recorder.stop();
    return;
  }

  if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
    alert("Bu brauzer mikrofon yozishni qo‘llab-quvvatlamaydi.");
    return;
  }

  if(!window.MediaRecorder){
    alert("Bu brauzer audio yozishni qo‘llab-quvvatlamaydi.");
    return;
  }

  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    const types=[
      "audio/webm;codecs=opus",
      "audio/webm",
      "audio/ogg;codecs=opus",
      "audio/ogg"
    ];
    const supported=types.find(type=>MediaRecorder.isTypeSupported(type));
    recorder=supported ? new MediaRecorder(stream,{mimeType:supported}) : new MediaRecorder(stream);
    chunks=[];
    recording=true;
    micBtn.textContent="⏹";
    micBtn.title="Yozuvni to‘xtatish";
    micBtn.style.background="#d93025";
    status.textContent="ovoz yozilmoqda...";
    recorder.ondataavailable=e=>{if(e.data && e.data.size>0) chunks.push(e.data);};
    recorder.onerror=e=>{
      console.error("MediaRecorder error:",e);
      stream.getTracks().forEach(t=>t.stop());
      recording=false;
      micBtn.textContent="🎤";
      micBtn.title="Ovoz yozish";
      alert("Ovoz yozishda xatolik yuz berdi.");
    };
    recorder.onstop=async()=>{
      stream.getTracks().forEach(t=>t.stop());
      const actualType=recorder.mimeType || supported || "audio/webm";
      const isOgg=actualType.toLowerCase().includes("ogg");
      const ext=isOgg ? "ogg" : "webm";
      const mime=actualType.split(";")[0];
      recording=false;
      micBtn.textContent="🎤";
      micBtn.title="Ovoz yozish";
      micBtn.style.background="";
      if(!chunks.length){
        alert("Ovoz yozilmadi. Qaytadan urinib ko‘ring.");
        return;
      }
      const file=new File(chunks,`voice-${Date.now()}.${ext}`,{type:mime});

      // Ovoz bu yerda YUBORILMAYDI.
      // Faqat previewga chiqadi. Foydalanuvchi eshitib,
      // keyin ➤ tugmasini bosgandagina yuboriladi.
      chooseFile(file);
      status.textContent="ovoz tayyor — eshitib ko‘ring";
    };
    recorder.start(250);
  }catch(e){
    console.error("Microphone error:",e);
    if(e.name==="NotAllowedError" || e.name==="PermissionDeniedError")
      alert("Mikrofonga ruxsat berilmagan. Chrome sayt sozlamalaridan Microphone → Allow qiling.");
    else if(e.name==="NotFoundError")
      alert("Mikrofon topilmadi. Kompyuterda mikrofon ulanganini tekshiring.");
    else if(e.name==="NotReadableError")
      alert("Mikrofon boshqa dastur tomonidan ishlatilmoqda.");
    else
      alert("Mikrofon ishlamadi: "+(e.message || e.name));
    recording=false;
    micBtn.textContent="🎤";
    micBtn.title="Ovoz yozish";
    micBtn.style.background="";
    status.textContent="kutib turimman";
  }
};
listTime.textContent=timeNow();
</script>
</body>
</html>
